name: PR Validation & Quality Gate

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main, master ]

# Cancel outdated workflow runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality, Formatting & Static Analysis
  # ============================================================================
  code-quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Check Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: The following files are not formatted properly according to gofmt:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' locally to fix formatting."
            exit 1
          fi

      - name: Run Go Vet Static Analysis
        run: go vet ./...

  # ============================================================================
  # 2. Multi-OS Test Matrix with Data Race Detector
  # ============================================================================
  test-matrix:
    name: Tests (${{ matrix.os }} - Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25', '1.26']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Tests (Linux with Race Detector)
        if: runner.os == 'Linux'
        run: go test -v -race -timeout=5m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run Tests (macOS & Windows)
        if: runner.os != 'Linux'
        run: go test -v -timeout=5m ./...

      - name: Upload Test Coverage Artifact
        if: runner.os == 'Linux' && matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.out

      - name: Report Coverage to DeepSource
        if: runner.os == 'Linux' && matrix.go-version == '1.26' && env.DEEPSOURCE_DSN != ''
        uses: deepsourcelabs/test-coverage-action@master
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        with:
          key: go
          coverage-file: coverage.out
          dsn: ${{ secrets.DEEPSOURCE_DSN }}
          fail-ci-on-error: false

  # ============================================================================
  # 3. Performance & Memory Allocation Benchmarks
  # ============================================================================
  benchmark-performance:
    name: Performance & Memory Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Microbenchmarks
        run: |
          echo "Running microbenchmarks to guard against throughput and memory allocation regressions..."
          go test -v -run='^$' -bench=. -benchmem ./pkg/ringbuffer ./pkg/analysis ./pkg/proxy ./pkg/storage ./pkg/certs ./pkg/dashboard

  # ============================================================================
  # 4. Security & Protocol Robustness Fuzz Testing
  # ============================================================================
  fuzz-testing:
    name: Security & Protocol Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Fuzz Ring Buffer
        run: go test -v -fuzz=FuzzRingBuffer -fuzztime=5s ./pkg/ringbuffer

      - name: Fuzz Aho-Corasick Matcher
        run: go test -v -fuzz=FuzzAhoCorasickMatcher_ScanBytes -fuzztime=5s ./pkg/analysis

      - name: Fuzz JWT Inspector
        run: go test -v -fuzz=FuzzJWTInspection -fuzztime=5s ./pkg/analysis

      - name: Fuzz Luhn & PII Validator
        run: go test -v -fuzz=FuzzLuhnValidation -fuzztime=5s ./pkg/analysis

      - name: Fuzz LLM Payload Inspector
        run: go test -v -fuzz=FuzzLLMInspector -fuzztime=5s ./pkg/analysis

      - name: Fuzz WebSocket Defragmenter
        run: go test -v -fuzz=FuzzWSDefragmenter -fuzztime=5s ./pkg/dashboard

      - name: Fuzz gRPC Message Framing
        run: go test -v -fuzz=FuzzGRPCFraming -fuzztime=5s ./pkg/proxy


  # ============================================================================
  # 5. End-to-End (E2E) & Integration Smoke Tests
  # ============================================================================
  e2e-integration-tests:
    name: End-to-End (E2E) Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run E2E Test Suite with Race Detector
        run: go test -v -race -timeout=3m ./test/e2e/...

  # ============================================================================
  # 6. Container Build & Packaging Smoke Test
  # ============================================================================
  docker-build-smoke:
    name: Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devproxy:ci-smoke .

  # ============================================================================
  # 7. Cross-Platform Compilation Check
  # ============================================================================
  cross-compile-check:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          OUTPUT="devproxy-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
          fi
          go build -v -ldflags="-s -w" -o "$OUTPUT" ./cmd/devproxy

  # ============================================================================
  # 8. PR Quality Gate: Required Status Check for Merging
  # ============================================================================
  pr-ready-to-merge:
    name: "PR Gate: Ready to Merge"
    needs: [code-quality, test-matrix, benchmark-performance, fuzz-testing, e2e-integration-tests, docker-build-smoke, cross-compile-check]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Upstream Tests and Zero Merge Conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          FAILED=0

          echo "==> 1. Checking Upstream CI Suites..."
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "❌ Code Quality / Lint checks failed."
            FAILED=1
          else
            echo "✅ Code Quality / Lint checks passed."
          fi
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "❌ Multi-OS Test suite failed on one or more platforms/runtimes."
            FAILED=1
          else
            echo "✅ Multi-OS Test suite passed."
          fi
          if [ "${{ needs.benchmark-performance.result }}" != "success" ]; then
            echo "❌ Benchmark performance checks failed."
            FAILED=1
          else
            echo "✅ Benchmark performance checks passed."
          fi
          if [ "${{ needs.fuzz-testing.result }}" != "success" ]; then
            echo "❌ Security fuzz testing failed."
            FAILED=1
          else
            echo "✅ Security fuzz testing passed."
          fi
          if [ "${{ needs.e2e-integration-tests.result }}" != "success" ]; then
            echo "❌ End-to-End integration tests failed."
            FAILED=1
          else
            echo "✅ End-to-End integration tests passed."
          fi
          if [ "${{ needs.docker-build-smoke.result }}" != "success" ]; then
            echo "❌ Docker container build failed."
            FAILED=1
          else
            echo "✅ Docker container build passed."
          fi
          if [ "${{ needs.cross-compile-check.result }}" != "success" ]; then
            echo "❌ Cross-platform compilation failed."
            FAILED=1
          else
            echo "✅ Cross-platform compilation passed."
          fi

          echo "==> 2. Checking Git Merge Conflicts against origin/main..."
          if [ -n "$PR_NUM" ]; then
            git fetch origin main --quiet
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            if ! git merge-base --is-ancestor origin/main HEAD 2>/dev/null; then
              if ! git merge --no-commit --no-ff origin/main 2>/dev/null; then
                echo "❌ MERGE CONFLICT DETECTED: PR #$PR_NUM cannot cleanly merge into main!"
                git merge --abort 2>/dev/null || true
                FAILED=1
              else
                echo "✅ Clean merge verified with origin/main (0 conflicts)."
                git merge --abort 2>/dev/null || true
              fi
            else
              echo "✅ PR branch is fully up to date with origin/main."
            fi
          fi

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "🚨 Pipeline blocked: CI checks failing or merge conflicts exist!"
            if [ -n "$PR_NUM" ]; then
              echo "Removing ready-to-merge label from PR #$PR_NUM..."
              gh pr edit "$PR_NUM" --remove-label "ready-to-merge" 2>/dev/null || true
            fi
            exit 1
          fi

          echo ""
          echo "🎉 All PR validation suites passed AND zero merge conflicts detected!"
          if [ -n "$PR_NUM" ]; then
            echo "Applying ready-to-merge badge/label to PR #$PR_NUM..."
            gh label create "ready-to-merge" --color "0e8a16" --description "Clean 100% green with 0 conflicts" --force 2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label "ready-to-merge" 2>/dev/null || true
          fi
