name: PR Validation & Quality Gate

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main, master ]

# Cancel outdated workflow runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality, Formatting & Static Analysis
  # ============================================================================
  code-quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Check Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: The following files are not formatted properly according to gofmt:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' locally to fix formatting."
            exit 1
          fi

      - name: Run Go Vet Static Analysis
        run: go vet ./...

  # ============================================================================
  # 2. Multi-OS Test Matrix with Data Race Detector
  # ============================================================================
  test-matrix:
    name: Tests (${{ matrix.os }} - Go ${{ matrix.go-version }})
    needs: code-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23', '1.24']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Tests (Linux with Race Detector)
        if: runner.os == 'Linux'
        run: go test -v -race -timeout=5m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run Tests (macOS & Windows)
        if: runner.os != 'Linux'
        run: go test -v -timeout=5m ./...

      - name: Upload Test Coverage Artifact
        if: runner.os == 'Linux' && matrix.go-version == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.out

      - name: Report Coverage to DeepSource
        if: runner.os == 'Linux' && matrix.go-version == '1.24' && env.DEEPSOURCE_DSN != ''
        uses: deepsourcelabs/test-coverage-action@master
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        with:
          key: go
          coverage-file: coverage.out
          dsn: ${{ secrets.DEEPSOURCE_DSN }}
          fail-ci-on-error: false

  # ============================================================================
  # 3. Cross-Platform Compilation Check
  # ============================================================================
  cross-compile-check:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          OUTPUT="devproxy-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
          fi
          go build -v -ldflags="-s -w" -o "$OUTPUT" ./cmd/devproxy

  # ============================================================================
  # 4. PR Quality Gate: Required Status Check for Merging
  # ============================================================================
  pr-ready-to-merge:
    name: "PR Gate: Ready to Merge"
    needs: [code-quality, test-matrix, cross-compile-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Upstream Pipeline Status
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "❌ Code Quality / Lint checks failed."
            exit 1
          fi
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "❌ Test suite failed on one or more platforms/runtimes."
            exit 1
          fi
          if [ "${{ needs.cross-compile-check.result }}" != "success" ]; then
            echo "❌ Cross-platform compilation failed."
            exit 1
          fi
          echo "🎉 All PR validation checks passed! PR is clean and green to merge."
