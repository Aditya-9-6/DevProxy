name: "Stale Issue & PR Bot"

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Manage Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Stale Bot Execution
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 14
          days-before-close: 7
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity over the last 14 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions!
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity over the last 14 days. If this PR is still relevant, please push an update or comment below, and our maintainers will review it. It will be closed in 7 days if inactive.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,roadmap,help wanted'
          exempt-pr-labels: 'pinned,wip,hacktoberfest-accepted'
