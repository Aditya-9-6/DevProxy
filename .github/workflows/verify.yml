name: Devproxy CI & Automated Verification

on:
  push:
    branches: [ main, master, pilot ]
  pull_request:
    branches: [ main, master, pilot ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:///test_devproxy.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn sqlalchemy aiosqlite pydantic prometheus-client --quiet

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v
