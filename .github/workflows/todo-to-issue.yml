name: "TODO & Advancement to Issue Bot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  todo-to-issue:
    name: "Scan & Convert Code Comments to Issues"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Scan for TODO and ADVANCEMENT comments"
        uses: "alstr/todo-to-issue-action@v5"
        with:
          CLOSE_ISSUES: true
          AUTO_ASSIGN: false
          IDENTIFIERS: '[{"name": "TODO", "labels": ["enhancement"]}, {"name": "ADVANCEMENT", "labels": ["enhancement", "hacktoberfest"]}, {"name": "FIXME", "labels": ["bug"]}, {"name": "OPTIMIZE", "labels": ["performance"]}]'
          IGNORE: '\.github/.*,web/.*,node_modules/.*,dist/.*,.*\.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
