name: AI Issue Approval & Gatekeeper Bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to evaluate for necessity and architecture"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: issue-approver-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  approve-issue:
    name: Issue Necessity & Architecture Gatekeeper
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && !github.event.issue.pull_request && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && (
        contains(github.event.comment.body, '/approve-issue') ||
        contains(github.event.comment.body, '/review-issue')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token (Higher Rate Limits)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Issue Approval & Refinement Engine
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_ISSUE_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY || '' }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || '' }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi

          echo "Evaluating Issue #$ISSUE_NUM for necessity, architectural value, and completeness..."
          python3 .github/scripts/ai_issue_approver.py --issue-number "$ISSUE_NUM" --workspace .
