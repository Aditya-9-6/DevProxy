name: Continuous Autonomous Advancement Engine

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes in GitHub cloud
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of autonomous development cycles to run'
        required: false
        default: '1'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: continuous-advancement-loop
  cancel-in-progress: false

jobs:
  advance:
    name: Autonomous Advancement Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git User Identity
        run: |
          git config user.name "Aditya Dahale"
          git config user.email "aditya-9-6@users.noreply.github.com"

      - name: Execute Autonomous Development Cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY || '' }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY || '' }}
        run: |
          python3 .github/scripts/autonomous_loop.py --workspace . --once
