name: Continuous Autonomous Advancement Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Executes 24/7 every 5 minutes in GitHub Actions Cloud (Free & Unlimited for Public Repos)
  issues:
    types: [opened]       # Instant event-driven trigger whenever an issue is created
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of autonomous development cycles to run'
        required: false
        default: '5'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  advance:
    name: Autonomous Engine (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [alpha, beta]
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GossipMesh
        run: |
          pip install git+https://github.com/Aditya-9-6/GossipMesh.git

      - name: Configure Git User Identity
        run: |
          git config user.name "Aditya Dahale"
          git config user.email "aditya-9-6@users.noreply.github.com"

      - name: Execute Continuous Multi-Cycle Development Batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY || '' }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY || '' }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY || '' }}
        run: |
          python3 .github/scripts/autonomous_loop.py --workspace . --interval 5 --max-cycles 5 --timeout-mins 20

      - name: Self-Trigger Next Advancement Run (Zero-Downtime Chain)
        if: always()
        run: |
          gh workflow run continuous-advancement.yml --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
