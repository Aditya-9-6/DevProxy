name: Continuous Autonomous Advancement Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Executes 24/7 every 5 minutes in GitHub Actions Cloud (Free & Unlimited for Public Repos)
  issues:
    types: [opened]       # Instant event-driven trigger whenever an issue is created
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of autonomous development cycles to run'
        required: false
        default: '30'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  advance:
    name: Autonomous Engine (Worker ${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [1, 2, 3, 4, 5, 6, 7, 8]
      fail-fast: false
      max-parallel: 8
    concurrency:
      group: continuous-advancement-worker-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # shallow clone for speed

      - name: Cache UV wheels and pip packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/*.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOPATH }}/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Cache uv.lock
        uses: actions/cache@v3
        with:
          path: uv.lock
          key: uv-lock-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-lock-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate GitHub App Token (Higher Rate Limits)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install GossipMesh
        run: |
          python -m pip install --upgrade uv
          uv pip install -e .[api,dev]

      - name: Configure Git User Identity
        run: |
          git config user.name "Aditya Dahale"
          git config user.email "aditya-9-6@users.noreply.github.com"

      - name: Execute Continuous Multi-Cycle Development Batch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY || '' }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY || '' }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || '' }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY || '' }}
          MODEL_TEMPERATURE: 0.2
          MODEL_MAX_TOKENS: 2048
          TOP_P: 0.95
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL || '' }}
        run: |
          python3 .github/scripts/autonomous_loop.py \
            --workspace . \
            --interval 3 \
            --max-cycles ${{ inputs.iterations || '30' }} \
            --timeout-mins 180 \
            --worker-id ${{ matrix.worker }} \
            --num-workers 8

      - name: Export Metrics
        if: always()
        run: |
          echo "--- Metrics collected during this run ---"
          # The autonomous_loop script writes a metrics.json file; this step just ensures it exists.
          ls -l metrics.json || echo "No metrics file generated."

      - name: Upload Metrics Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: metrics-${{ matrix.worker }}
          path: metrics.json
