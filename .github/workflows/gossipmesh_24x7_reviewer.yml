name: GossipMesh 24/7 AI Code Reviewer

on:
  schedule:
    # 24/7 continuous autonomous processing every 10 minutes
    - cron: '*/10 * * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: gossipmesh-devproxy-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    name: GossipMesh Multi-Provider Reviewer
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
        contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/audit')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout DevProxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout GossipMesh Engine
        uses: actions/checkout@v4
        with:
          repository: Aditya-9-6/GossipMesh
          path: .gossipmesh

      - name: Install Reviewer Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .gossipmesh/requirements.txt

      - name: Verify GitHub CLI Authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status

      - name: Run GossipMesh Multi-Provider Autonomous Reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "[*] Triggered on PR #$PR_NUM. Running AI Architectural & Security Review..."
            PYTHONPATH=.gossipmesh python .gossipmesh/scripts/ai_pr_reviewer.py --pr-number "$PR_NUM" --workspace .
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUM="${{ github.event.issue.number }}"
            echo "[*] Triggered by comment on PR #$PR_NUM. Re-evaluating review..."
            PYTHONPATH=.gossipmesh python .gossipmesh/scripts/ai_pr_reviewer.py --pr-number "$PR_NUM" --workspace .
          else
            echo "[*] Running 24/7 Multi-Worker Batch Processor across all open DevProxy PRs..."
            PYTHONPATH=.gossipmesh python .gossipmesh/scripts/batch_process_prs_optimized.py --repo "${{ github.repository }}" --workspace .
          fi
