proxy:
  - changed-files:
    - any-glob-to-any-file: 'pkg/proxy/**/*'
    - any-glob-to-any-file: 'cmd/devproxy/**/*'

waf:
  - changed-files:
    - any-glob-to-any-file: 'pkg/waf/**/*'
    - any-glob-to-any-file: 'pkg/security/**/*'
    - any-glob-to-any-file: 'pkg/analysis/**/*'

dashboard:
  - changed-files:
    - any-glob-to-any-file: 'web/**/*'
    - any-glob-to-any-file: 'pkg/dashboard/**/*'

extension:
  - changed-files:
    - any-glob-to-any-file: 'vscode-extension/**/*'

docs:
  - changed-files:
    - any-glob-to-any-file: 'docs/**/*'
    - any-glob-to-any-file: 'README.md'

testing:
  - changed-files:
    - any-glob-to-any-file: 'test/**/*'
    - any-glob-to-any-file: 'pkg/mock/**/*'
    - any-glob-to-any-file: 'pkg/replay/**/*'
    - any-glob-to-any-file: 'pkg/contract/**/*'
