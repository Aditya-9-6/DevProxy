<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevProxy Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --border: #334155;
        }
        [data-theme='light'] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --border: #e2e8f0;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; transition: background 0.3s; }
        .navbar { display: flex; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--border); }
        #theme-toggle { cursor: pointer; background: none; border: 1px solid var(--border); padding: 0.5rem; border-radius: 4px; color: var(--text-main); }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>DevProxy</h1>
        <button id="theme-toggle">Toggle Theme</button>
    </nav>
    <script>
        const toggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('devproxy_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);

        toggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('devproxy_theme', theme);
        });
    </script>
</body>
</html>
