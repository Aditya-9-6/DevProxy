<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevProxy - Zero-Latency Security Proxy</title>
  <style>
    :root { --bg-dark: #0a0d14; --text-main: #f1f5f9; --accent: #3b82f6; }
    [data-theme="light"] { --bg-dark: #f8fafc; --text-main: #0f172a; --accent: #2563eb; }
    body { background: var(--bg-dark); color: var(--text-main); font-family: sans-serif; }
  </style>
</head>
<body>
  <header>
    <h1>DevProxy Dashboard</h1>
    <button id="theme-toggle">Toggle Theme</button>
  </header>
  <div id="dashboard-content">[Existing Dashboard Components Restored]</div>
  <script>
    const toggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
