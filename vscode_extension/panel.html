<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevProxy Agent Panel</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    #log { padding: 10px; white-space: pre-wrap; background: #f5f5f5; height: 40vh; overflow-y: auto; }
    .error { color: red; }
    #statusBadge { font-weight: bold; margin-left: 8px; }
    #diffContainer { margin: 10px; }
    #applyBtn { padding: 6px 12px; margin-top: 4px; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="log">Connecting to DevProxy...</div>
  <div id="diffContainer" style="display:none;">
    <label>Generated Diff (editable):</label>
    <textarea id="diffTextarea"></textarea>
    <button id="applyBtn">⚡ Apply Fix & Replay</button>
    <span id="statusBadge" class="error">🔴</span>
  </div>
  <script>
    const logEl = document.getElementById('log');
    const ws = new WebSocket('ws://127.0.0.1:8002/ws/panel');
    const diffContainer = document.getElementById('diffContainer');
    const diffTextarea = document.getElementById('diffTextarea');
    const applyBtn = document.getElementById('applyBtn');
    const statusBadge = document.getElementById('statusBadge');
    let currentIncidentId = null;

    ws.onopen = () => logEl.textContent = 'Connected. Listening for events...';
    ws.onmessage = async (e) => {
      const data = e.data;
      const line = document.createElement('div');
      line.textContent = data;
      if (data.toLowerCase().includes('error')) line.classList.add('error');
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;

      // Expect event JSON with incident_id when a new incident is queued
      try {
        const ev = JSON.parse(data);
        if (ev.incident_id) {
          currentIncidentId = ev.incident_id;
          // Fetch diff details
          const resp = await fetch(`/v1/panel/incident/${currentIncidentId}`);
          const inc = await resp.json();
          diffTextarea.value = inc.generated_diff || '';
          diffContainer.style.display = 'block';
          statusBadge.textContent = '🔴';
          statusBadge.className = 'error';
        }
      } catch (_) {}
    };
    ws.onerror = (e) => { const line = document.createElement('div'); line.textContent = 'WebSocket error: ' + e; line.classList.add('error'); logEl.appendChild(line); };
    ws.onclose = () => { const line = document.createElement('div'); line.textContent = 'Connection closed.'; line.classList.add('error'); logEl.appendChild(line); };

    applyBtn.onclick = async () => {
      if (!currentIncidentId) return alert('No incident loaded');
      const payload = { incident_id: currentIncidentId, diff: diffTextarea.value };
      const resp = await fetch('/v1/panel/apply_fix', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await resp.json();
      if (result.apply_success && result.replay_success) {
        statusBadge.textContent = '🟢';
        statusBadge.className = '';
      } else {
        statusBadge.textContent = '🔴';
        statusBadge.className = 'error';
        alert('Apply/Replay failed: ' + (result.error || 'unknown'));
      }
    };
  </script>
</body>
</html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevProxy Agent Panel</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    #log { padding: 10px; white-space: pre-wrap; background: #f5f5f5; height: 100vh; overflow-y: auto; }
    .error { color: red; }
  </style>
</head>
<body>
  <div id="log">Connecting to DevProxy...</div>
  <script>
    const logEl = document.getElementById('log');
    const ws = new WebSocket('ws://127.0.0.1:8002/ws/panel');
    ws.onopen = () => logEl.textContent = 'Connected. Listening for events...';
    ws.onmessage = (e) => {
      const data = e.data;
      const line = document.createElement('div');
      line.textContent = data;
      if (data.toLowerCase().includes('error')) line.classList.add('error');
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    };
    ws.onerror = (e) => {
      const line = document.createElement('div');
      line.textContent = 'WebSocket error: ' + e;
      line.classList.add('error');
      logEl.appendChild(line);
    };
    ws.onclose = () => {
      const line = document.createElement('div');
      line.textContent = 'Connection closed.';
      line.classList.add('error');
      logEl.appendChild(line);
    };
  </script>
</body>
</html>
