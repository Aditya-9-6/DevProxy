version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devproxy
      POSTGRES_PASSWORD: devproxypwd
      POSTGRES_DB: devproxydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devproxy -d devproxydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.saas
    environment:
      DATABASE_URL: postgresql+psycopg2://devproxy:devproxypwd@postgres:5432/devproxydb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn devproxy_agent.saas.control_plane:app --host 0.0.0.0 --port 8002

volumes:
  pgdata: